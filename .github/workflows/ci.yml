name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (40+ cases covering transforms + contrast logic)
        run: npm test

      - name: Round-trip example build (Tailwind + CSS + TS outputs)
        run: npm run cli -- build --input examples/tokens.json --out-dir /tmp/tokenforge-example-out

      - name: WCAG contrast gate on example token set
        run: npm run cli -- check-contrast --input examples/tokens.json

  contrast-gate:
    name: WCAG contrast gate (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Fail the PR if any declared token pair breaks WCAG AA
        run: npm run cli -- check-contrast --input examples/tokens.json

      - name: Report token drift against main
        run: |
          git fetch origin main --depth=1
          if git show origin/main:examples/tokens.json > /tmp/tokens-main.json 2>/dev/null; then
            npm run cli -- diff --a /tmp/tokens-main.json --b examples/tokens.json
          else
            echo "No token source found on main yet -- skipping drift report."
          fi
